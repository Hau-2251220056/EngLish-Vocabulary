name: TASK-264 H4 P4 P3 PostgreSQL 17

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Exact guarded TASK-264 Phase 3 operation
        required: true
        type: choice
        default: NOT_AUTHORIZED
        options:
          - NOT_AUTHORIZED
          - TASK264_H4_P4_P3_POSTGRESQL_17
      authorize_postgresql_verification:
        description: HUMAN authorization for this exact run
        required: true
        type: boolean
        default: false
      expected_source_sha:
        description: Exact lowercase feature source SHA authorized by HUMAN
        required: true
        type: string
      expected_source_ref:
        description: Exact feature ref authorized by HUMAN
        required: true
        type: string
      expected_workflow_sha:
        description: Exact lowercase commit containing this reviewed workflow
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: task264-h4-p4-p3-${{ github.repository }}-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify immutable default-deny dispatch binding
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
          EVENT_WORKFLOW: ${{ github.workflow }}
          EVENT_WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REQUESTED_OPERATION: ${{ inputs.operation }}
          REQUESTED_AUTHORIZATION: ${{ inputs.authorize_postgresql_verification }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXPECTED_SOURCE_REF: ${{ inputs.expected_source_ref }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.expected_workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_NAME" == "workflow_dispatch" ]] || { echo "Refusal: event mismatch"; exit 1; }
          [[ "$EVENT_REPOSITORY" == "Hau-2251220056/EngLish-Vocabulary" ]] || { echo "Refusal: repository mismatch"; exit 1; }
          [[ "$EVENT_WORKFLOW" == "TASK-264 H4 P4 P3 PostgreSQL 17" ]] || { echo "Refusal: workflow mismatch"; exit 1; }
          [[ "$EVENT_WORKFLOW_REF" == "Hau-2251220056/EngLish-Vocabulary/.github/workflows/daily-goal-task264-h4-p4-p3-postgresql.yml@$EVENT_REF" ]] || { echo "Refusal: workflow ref mismatch"; exit 1; }
          [[ "$REQUESTED_OPERATION" == "TASK264_H4_P4_P3_POSTGRESQL_17" ]] || { echo "Refusal: operation mismatch"; exit 1; }
          [[ "$REQUESTED_AUTHORIZATION" == "true" ]] || { echo "Refusal: HUMAN authorization missing"; exit 1; }
          [[ "$RUN_ATTEMPT" == "1" ]] || { echo "Refusal: reruns are not authorized"; exit 1; }
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Refusal: source SHA malformed"; exit 1; }
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Refusal: workflow SHA malformed"; exit 1; }
          [[ "$EXPECTED_SOURCE_SHA" == "$EVENT_SHA" ]] || { echo "Refusal: source SHA mismatch"; exit 1; }
          [[ "$EXPECTED_SOURCE_REF" == "$EVENT_REF" ]] || { echo "Refusal: source ref mismatch"; exit 1; }
          [[ "$EVENT_REF" == "refs/heads/feature/daily-goal-v1" ]] || { echo "Refusal: feature ref mismatch"; exit 1; }
          [[ "$WORKFLOW_SHA" == "$EXPECTED_WORKFLOW_SHA" ]] || { echo "Refusal: workflow SHA mismatch"; exit 1; }
          [[ "$WORKFLOW_SHA" == "$EVENT_SHA" ]] || { echo "Refusal: workflow/source mismatch"; exit 1; }

  postgresql-verification:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: task264_lifecycle_ephemeral
          POSTGRES_USER: task264_lifecycle_ephemeral
          POSTGRES_PASSWORD: task264-${{ github.run_id }}-${{ github.run_attempt }}-ephemeral
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U task264_lifecycle_ephemeral -d task264_lifecycle_ephemeral"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: "true"
      NODE_ENV: test
      TASK264_P3_OPERATION: TASK264_H4_P4_P3_POSTGRESQL_17
      TASK264_P3_AUTHORIZED: "true"
      TASK264_P3_REPOSITORY: ${{ github.repository }}
      TASK264_P3_SOURCE_SHA: ${{ github.sha }}
      TASK264_P3_SOURCE_REF: ${{ github.ref }}
      TASK264_P3_WORKFLOW: ${{ github.workflow }}
      TASK264_P3_WORKFLOW_REF: ${{ github.workflow_ref }}
      TASK264_P3_WORKFLOW_SHA: ${{ github.workflow_sha }}
      TASK264_P3_EXPECTED_WORKFLOW_SHA: ${{ inputs.expected_workflow_sha }}
      TASK264_P3_RUN_ATTEMPT: ${{ github.run_attempt }}
      TASK264_P3_JOB_DATABASE_URL: postgresql://task264_lifecycle_ephemeral:task264-${{ github.run_id }}-${{ github.run_attempt }}-ephemeral@127.0.0.1:5432/task264_lifecycle_ephemeral
      TASK264_P3_TEST_ONLY_LEASE_MS: "5000"
      TASK264_P3_TEST_ONLY_TIMEOUT_MS: "30000"
    steps:
      - name: Refuse reruns before checkout or database-capable work
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ github.run_attempt }}" == "1" ]] || { echo "Refusal: reruns are not authorized"; exit 1; }

      - name: Check out exact source revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify detached checkout and immutable binding
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${{ inputs.expected_source_sha }}" ]] || { echo "Refusal: checkout SHA mismatch"; exit 1; }
          [[ "${{ github.sha }}" == "${{ inputs.expected_workflow_sha }}" ]] || { echo "Refusal: workflow SHA mismatch"; exit 1; }
          if git symbolic-ref -q HEAD >/dev/null; then echo "Refusal: checkout is not detached"; exit 1; fi

      - name: Set up Node.js 22.20.0
        uses: actions/setup-node@v7
        with:
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install locked dependencies without lifecycle scripts
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Run offline fail-closed safety suite
        working-directory: backend
        run: node --test --test-concurrency=1 test/daily-goal/daily-goal-task264-h4-p4-p3-offline.test.js

      - name: Run guarded disposable PostgreSQL verification
        working-directory: backend
        run: node test/daily-goal/daily-goal-task264-h4-p4-p3-cli.js --run

      - name: Verify clean tracked checkout postflight
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "$(git status --short --untracked-files=no)" ]] || { echo "Refusal: tracked checkout changed"; exit 1; }
