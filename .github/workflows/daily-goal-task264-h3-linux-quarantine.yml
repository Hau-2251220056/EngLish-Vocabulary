name: Daily Goal TASK-264 H3 Linux Quarantine

on:
  workflow_dispatch:
    inputs:
      confirm_run:
        description: Explicitly authorize this one bounded quarantine verification run
        required: true
        default: false
        type: boolean
      expected_workflow_sha:
        description: Reviewed workflow publication commit SHA on main
        required: true
        type: string
      expected_source_ref:
        description: Pinned lifecycle source ref
        required: true
        default: refs/heads/feature/daily-goal-v1
        type: string
      expected_source_sha:
        description: Pinned immutable lifecycle source SHA
        required: true
        default: 1516701372171821cd8b08a0dde7b3ce4b4c7fcb
        type: string
      expected_parent_sha:
        description: Expected parent of the pinned source SHA
        required: true
        default: 42078f385f084b824c8695c7b1c825f8f45aa7e9
        type: string

permissions:
  contents: read

concurrency:
  group: daily-goal-task264-h3-linux-quarantine
  cancel-in-progress: false

jobs:
  verify:
    name: Verify quarantined lifecycle artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Fail-closed dispatch and workflow identity guard
        shell: bash
        env:
          CONFIRM_RUN: ${{ inputs.confirm_run }}
          INPUT_WORKFLOW_SHA: ${{ inputs.expected_workflow_sha }}
          INPUT_SOURCE_REF: ${{ inputs.expected_source_ref }}
          INPUT_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          INPUT_PARENT_SHA: ${{ inputs.expected_parent_sha }}
          ACTUAL_REPOSITORY: ${{ github.repository }}
          ACTUAL_EVENT: ${{ github.event_name }}
          ACTUAL_REF: ${{ github.ref }}
          ACTUAL_SHA: ${{ github.sha }}
          ACTUAL_WORKFLOW_REF: ${{ github.workflow_ref }}
          ACTUAL_WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail

          pinned_repository="Hau-2251220056/EngLish-Vocabulary"
          pinned_workflow_ref="Hau-2251220056/EngLish-Vocabulary/.github/workflows/daily-goal-task264-h3-linux-quarantine.yml@refs/heads/main"
          pinned_source_ref="refs/heads/feature/daily-goal-v1"
          pinned_source_sha="1516701372171821cd8b08a0dde7b3ce4b4c7fcb"
          pinned_parent_sha="42078f385f084b824c8695c7b1c825f8f45aa7e9"

          [[ "$CONFIRM_RUN" == "true" ]]
          [[ "$ACTUAL_REPOSITORY" == "$pinned_repository" ]]
          [[ "$ACTUAL_EVENT" == "workflow_dispatch" ]]
          [[ "$ACTUAL_REF" == "refs/heads/main" ]]
          [[ "$ACTUAL_WORKFLOW_REF" == "$pinned_workflow_ref" ]]
          [[ "$RUN_ATTEMPT" == "1" ]]

          [[ "$INPUT_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$INPUT_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$INPUT_PARENT_SHA" =~ ^[0-9a-f]{40}$ ]]

          [[ "$INPUT_SOURCE_REF" == "$pinned_source_ref" ]]
          [[ "$INPUT_SOURCE_SHA" == "$pinned_source_sha" ]]
          [[ "$INPUT_PARENT_SHA" == "$pinned_parent_sha" ]]

          [[ "$ACTUAL_SHA" == "$INPUT_WORKFLOW_SHA" ]]
          [[ "$ACTUAL_WORKFLOW_SHA" == "$INPUT_WORKFLOW_SHA" ]]

      - name: Checkout immutable lifecycle source
        id: source_checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1516701372171821cd8b08a0dde7b3ce4b4c7fcb
          fetch-depth: 2
          persist-credentials: false
          clean: true

      - name: Verify remote feature ref and exact source identity
        shell: bash
        env:
          PINNED_SOURCE_REF: refs/heads/feature/daily-goal-v1
          PINNED_SOURCE_SHA: 1516701372171821cd8b08a0dde7b3ce4b4c7fcb
          PINNED_PARENT_SHA: 42078f385f084b824c8695c7b1c825f8f45aa7e9
          PINNED_SUBJECT: "chore(daily-goal): snapshot quarantined lifecycle artifacts pending verification"
          REMOTE_URL: https://github.com/Hau-2251220056/EngLish-Vocabulary.git
        run: |
          set -euo pipefail

          mapfile -t remote_lines < <(
            git ls-remote --heads "$REMOTE_URL" "$PINNED_SOURCE_REF"
          )

          [[ "${#remote_lines[@]}" -eq 1 ]]
          read -r remote_sha remote_ref <<< "${remote_lines[0]}"
          [[ "$remote_sha" == "$PINNED_SOURCE_SHA" ]]
          [[ "$remote_ref" == "$PINNED_SOURCE_REF" ]]

          [[ "$(git rev-parse HEAD)" == "$PINNED_SOURCE_SHA" ]]
          [[ "$(git rev-parse HEAD^)" == "$PINNED_PARENT_SHA" ]]
          [[ "$(git log -1 --format=%s)" == "$PINNED_SUBJECT" ]]

          if git symbolic-ref -q HEAD >/dev/null 2>&1; then
            echo "Expected detached HEAD." >&2
            exit 1
          fi

          [[ -z "$(git status --porcelain --untracked-files=all)" ]]

      - name: Verify exact six-file source commit inventory
        shell: bash
        run: |
          set -euo pipefail

          expected_file="${RUNNER_TEMP}/expected-source-inventory.txt"
          actual_file="${RUNNER_TEMP}/actual-source-inventory.txt"

          cat > "$expected_file" <<'EOF'
          A	backend/prisma/migration-drafts/daily-goal-v1/20261031000000_add_daily_goal_tracking_expired_status/migration.sql
          A	backend/prisma/migration-drafts/daily-goal-v1/20261031000001_add_daily_goal_lifecycle_expiry/migration.sql
          A	backend/prisma/migration-drafts/daily-goal-v1/lifecycle-manifest.json
          M	backend/prisma/schema.prisma
          M	backend/test/daily-goal/daily-goal-migration-quarantine.js
          M	backend/test/daily-goal/daily-goal-migration-quarantine.test.js
          EOF

          git diff-tree \
            --no-commit-id \
            --name-status \
            -r HEAD^ HEAD > "$actual_file"

          diff --unified=0 "$expected_file" "$actual_file"

          protected_observers=(
            backend/test/daily-goal/daily-goal-destination-observation-cli.js
            backend/test/daily-goal/daily-goal-destination-observation-offline.js
            backend/test/daily-goal/daily-goal-destination-observation-offline.test.js
          )
          for observer in "${protected_observers[@]}"; do
            [[ -z "$(git ls-tree -r --name-only HEAD -- "$observer")" ]]
          done

      - name: Verify quarantine identities and active-migration exclusion
        shell: bash
        working-directory: backend
        run: |
          set -euo pipefail

          cat <<'EOF' | sha256sum --check --strict
          607f487d7a203c787216188ca92464e359fbcdc23e3df116655c6a541e59ed1c  test/daily-goal/daily-goal-migration-quarantine.js
          7617626c1b8d5847b391f872c03fe6e908030ea6baac61e073153268b77cab94  test/daily-goal/daily-goal-migration-quarantine.test.js
          EOF

          test -f prisma/migration-drafts/daily-goal-v1/20261031000000_add_daily_goal_tracking_expired_status/migration.sql
          test -f prisma/migration-drafts/daily-goal-v1/20261031000001_add_daily_goal_lifecycle_expiry/migration.sql
          test -f prisma/migration-drafts/daily-goal-v1/lifecycle-manifest.json

          test ! -e prisma/migrations/20261031000000_add_daily_goal_tracking_expired_status
          test ! -e prisma/migrations/20261031000001_add_daily_goal_lifecycle_expiry

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.20.0"
          package-manager-cache: false

      - name: Verify exact Node version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(node --version)" == "v22.20.0" ]]

      - name: Prepare isolated fixture directory
        id: fixture_prepare
        shell: bash
        run: |
          set -euo pipefail
          fixture_root="${RUNNER_TEMP}/task264-h3-quarantine-fixtures"
          test ! -e "$fixture_root"
          mkdir -m 700 "$fixture_root"

      - name: Run the quarantine test exactly once and retain TAP
        id: quarantine_test
        shell: bash
        working-directory: backend
        env:
          TMPDIR: ${{ runner.temp }}/task264-h3-quarantine-fixtures
          TAP_REPORT: ${{ runner.temp }}/task264-h3-quarantine.tap
        run: |
          set -euo pipefail
          test ! -e "$TAP_REPORT"

          set +e
          node \
            --test \
            --test-concurrency=1 \
            --test-reporter=tap \
            test/daily-goal/daily-goal-migration-quarantine.test.js \
            | tee "$TAP_REPORT"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e

          [[ "${#pipeline_status[@]}" -eq 2 ]]
          [[ "${pipeline_status[0]}" -eq 0 ]]
          [[ "${pipeline_status[1]}" -eq 0 ]]

      - name: Verify deterministic TAP result and file-symlink execution
        shell: bash
        env:
          TAP_REPORT: ${{ runner.temp }}/task264-h3-quarantine.tap
        run: |
          set -euo pipefail
          test -s "$TAP_REPORT"

          grep -Eq '^[[:space:]]*1\.\.17[[:space:]]*$' "$TAP_REPORT"
          grep -Eq '^[[:space:]]*# tests 17[[:space:]]*$' "$TAP_REPORT"
          grep -Eq '^[[:space:]]*# pass 17[[:space:]]*$' "$TAP_REPORT"
          grep -Eq '^[[:space:]]*# fail 0[[:space:]]*$' "$TAP_REPORT"
          grep -Eq '^[[:space:]]*# skipped 0[[:space:]]*$' "$TAP_REPORT"
          grep -Eq '^[[:space:]]*# cancelled 0[[:space:]]*$' "$TAP_REPORT"
          grep -Eq '^[[:space:]]*# todo 0[[:space:]]*$' "$TAP_REPORT"

          grep -Eq \
            '^[[:space:]]*ok [0-9]+ - Q2 rejects linked lifecycle artifact files[[:space:]]*$' \
            "$TAP_REPORT"

          if grep -Eq '^[[:space:]]*not ok([[:space:]]|$)' "$TAP_REPORT"; then
            echo "TAP contains a failing test." >&2
            exit 1
          fi

          if grep -Eiq '^[[:space:]]*(not )?ok [0-9]+ - .*#[[:space:]]*(SKIP|TODO)([[:space:]]|$)' "$TAP_REPORT"; then
            echo "TAP contains a skipped or TODO test directive." >&2
            exit 1
          fi

      - name: Verify fixture cleanup and clean Git postflight
        if: ${{ always() && steps.source_checkout.outcome == 'success' }}
        shell: bash
        env:
          FIXTURE_PREPARE_OUTCOME: ${{ steps.fixture_prepare.outcome }}
          TEST_OUTCOME: ${{ steps.quarantine_test.outcome }}
          FIXTURE_ROOT: ${{ runner.temp }}/task264-h3-quarantine-fixtures
        run: |
          set -euo pipefail

          if [[ "$FIXTURE_PREPARE_OUTCOME" == "success" ]]; then
            [[ "$TEST_OUTCOME" == "success" || "$TEST_OUTCOME" == "failure" ]]
            test -d "$FIXTURE_ROOT"
          elif test -e "$FIXTURE_ROOT"; then
            test -d "$FIXTURE_ROOT"
          fi

          if test -d "$FIXTURE_ROOT"; then
            if find "$FIXTURE_ROOT" -mindepth 1 -print -quit | grep -q .; then
              echo "Temporary fixture content remains." >&2
              find "$FIXTURE_ROOT" -mindepth 1 -maxdepth 3 -print >&2
              exit 1
            fi
            rmdir "$FIXTURE_ROOT"
          elif [[ "$FIXTURE_PREPARE_OUTCOME" == "success" ]]; then
            echo "Prepared fixture root is unexpectedly absent." >&2
            exit 1
          fi

          [[ "$(git rev-parse HEAD)" == "1516701372171821cd8b08a0dde7b3ce4b4c7fcb" ]]
          [[ "$(git rev-parse HEAD^)" == "42078f385f084b824c8695c7b1c825f8f45aa7e9" ]]

          if git symbolic-ref -q HEAD >/dev/null 2>&1; then
            echo "HEAD is no longer detached." >&2
            exit 1
          fi

          [[ -z "$(git status --porcelain --untracked-files=all)" ]]
