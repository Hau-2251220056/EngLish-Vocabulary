name: Migration Dispatch Bootstrap

# Temporary default-branch registration only. Reviewed migration verification
# workflows live on their feature refs and must be selected explicitly.
on:
  workflow_dispatch:
    inputs:
      run_xp_migration_harness:
        description: Run the reviewed XP migration harness workflow
        required: true
        default: false
        type: boolean
      run_streak_migration_harness:
        description: Run the reviewed Streak migration verification workflow
        required: true
        default: false
        type: boolean
      run_streak_foundation_harness:
        description: Run the reviewed Streak Backend foundation integration harness
        required: true
        default: false
        type: boolean
      run_daily_goal_migration_observation:
        description: Reserved read-only Daily Goal Phase B observation (live execution disabled)
        required: true
        default: false
        type: boolean
      run_daily_goal_migration_verification:
        description: Reserved Daily Goal Phase D migration verification (live execution disabled)
        required: true
        default: false
        type: boolean
      streak_approved_target_identity:
        description: HUMAN-approved non-secret CI TEST identity (hostname:port/database)
        required: false
        type: string

permissions:
  contents: read

jobs:
  registration-only:
    name: Refuse bootstrap execution
    runs-on: ubuntu-latest
    steps:
      - name: Stop on the bootstrap workflow
        run: |
          echo "This bootstrap only registers manual dispatch. Select the reviewed migration feature ref."
          exit 1
