name: Daily Goal DG-1 Ephemeral PostgreSQL

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Exact guarded operation
        required: true
        type: choice
        default: NOT_AUTHORIZED
        options:
          - NOT_AUTHORIZED
          - DAILY_GOAL_DG1_EPHEMERAL_POSTGRESQL_17
      authorize_ephemeral_migration:
        description: HUMAN authorization for this exact run
        required: true
        type: boolean
        default: false
      expected_source_sha:
        description: Exact lowercase feature commit SHA authorized by HUMAN
        required: true
        type: string
      expected_source_ref:
        description: Exact feature ref authorized by HUMAN
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: daily-goal-dg1-ephemeral-${{ github.repository }}-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify immutable dispatch binding
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXPECTED_SOURCE_REF: ${{ inputs.expected_source_ref }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_RUN_ID: ${{ github.run_id }}
          EVENT_RUN_ATTEMPT: ${{ github.run_attempt }}
          REQUESTED_OPERATION: ${{ inputs.operation }}
          REQUESTED_AUTHORIZATION: ${{ inputs.authorize_ephemeral_migration }}
        run: |
          set -euo pipefail
          [[ "$EVENT_NAME" == "workflow_dispatch" ]] || { echo "Refusal: event is not workflow_dispatch"; exit 1; }
          [[ "$EVENT_REPOSITORY" == "Hau-2251220056/EngLish-Vocabulary" ]] || { echo "Refusal: repository mismatch"; exit 1; }
          [[ "$REQUESTED_OPERATION" == "DAILY_GOAL_DG1_EPHEMERAL_POSTGRESQL_17" ]] || { echo "Refusal: operation mismatch"; exit 1; }
          [[ "$REQUESTED_AUTHORIZATION" == "true" ]] || { echo "Refusal: authorization missing"; exit 1; }
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Refusal: expected source SHA is malformed"; exit 1; }
          [[ "$EXPECTED_SOURCE_SHA" == "$EVENT_SHA" ]] || { echo "Refusal: expected source SHA mismatch"; exit 1; }
          [[ "$EXPECTED_SOURCE_REF" == "$EVENT_REF" ]] || { echo "Refusal: expected source ref mismatch"; exit 1; }
          [[ "$EVENT_REF" == "refs/heads/feature/daily-goal-v1" ]] || { echo "Refusal: event ref is not the authorized feature ref"; exit 1; }
          [[ "$WORKFLOW_SHA" == "$EVENT_SHA" ]] || { echo "Refusal: workflow SHA mismatch"; exit 1; }
          [[ "$EVENT_RUN_ID" =~ ^[0-9]+$ ]] || { echo "Refusal: run ID is malformed"; exit 1; }
          [[ "$EVENT_RUN_ATTEMPT" =~ ^[0-9]+$ ]] || { echo "Refusal: run attempt is malformed"; exit 1; }

  ephemeral-migration:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: daily_goal_ephemeral
          POSTGRES_USER: daily_goal_ephemeral
          POSTGRES_PASSWORD: dg-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daily_goal_ephemeral -d daily_goal_ephemeral"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: "true"
      DAILY_GOAL_EPHEMERAL_OPERATION: DAILY_GOAL_DG1_EPHEMERAL_POSTGRESQL_17
      DAILY_GOAL_EPHEMERAL_AUTHORIZED: "true"
      DAILY_GOAL_POSTGRESQL_MAJOR: "17"
      DAILY_GOAL_MIGRATION_INVENTORY_DIGEST: 833edeb16488fc71fbbea22532531699eb2ffb9334b5b4f1d6ff5bcf0d41c864
      DAILY_GOAL_MIGRATION_SIZE: "11487"
      DAILY_GOAL_MIGRATION_SHA256: 8e468739c3f60693e9ff53d1c3d4107124ac1feaa9d95ac3a665ea8b8c89edb6
      DAILY_GOAL_EPHEMERAL_JOB_DATABASE_URL: postgresql://daily_goal_ephemeral:dg-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/daily_goal_ephemeral
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify detached checkout binding
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXPECTED_SOURCE_REF: ${{ inputs.expected_source_ref }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EVENT_RUN_ID: ${{ github.run_id }}
          EVENT_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          CHECKOUT_SHA="$(git rev-parse HEAD)"
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Refusal: expected source SHA is malformed after checkout"; exit 1; }
          [[ "$EXPECTED_SOURCE_REF" == "$EVENT_REF" ]] || { echo "Refusal: expected source ref mismatch after checkout"; exit 1; }
          [[ "$EVENT_REF" == "refs/heads/feature/daily-goal-v1" ]] || { echo "Refusal: event ref changed after preflight"; exit 1; }
          [[ "$WORKFLOW_SHA" == "$EVENT_SHA" ]] || { echo "Refusal: workflow SHA changed after preflight"; exit 1; }
          [[ "$CHECKOUT_SHA" == "$EXPECTED_SOURCE_SHA" ]] || { echo "Refusal: checkout SHA does not match expected source SHA"; exit 1; }
          [[ "$CHECKOUT_SHA" == "$EVENT_SHA" ]] || { echo "Refusal: checkout SHA does not match event SHA"; exit 1; }
          if git symbolic-ref -q HEAD >/dev/null; then
            echo "Refusal: checkout is not detached"
            exit 1
          fi
          printf '%s\n' \
            "expected_source_sha=$EXPECTED_SOURCE_SHA" \
            "github_event_sha=$EVENT_SHA" \
            "github_workflow_sha=$WORKFLOW_SHA" \
            "checkout_sha=$CHECKOUT_SHA" \
            "expected_source_ref=$EXPECTED_SOURCE_REF" \
            "github_event_ref=$EVENT_REF" \
            "github_run_id=$EVENT_RUN_ID" \
            "github_run_attempt=$EVENT_RUN_ATTEMPT"

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install locked backend dependencies without lifecycle scripts
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Run focused offline migration verification
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/daily-goal-ephemeral-focused.tap"
          node --test --test-concurrency=1 backend/test/daily-goal/daily-goal-ephemeral-migration.test.js | tee "$report"
          if grep -Eq '# (SKIP|TODO)' "$report"; then
            echo "Refusal: focused suite reported an unexpected skip or todo"
            exit 1
          fi

      - name: Generate the job-local raw-query Prisma client
        working-directory: backend
        run: node test/daily-goal/daily-goal-ephemeral-migration-cli.js --generate

      - name: Run guarded ephemeral migration verification
        working-directory: backend
        run: node test/daily-goal/daily-goal-ephemeral-migration-cli.js
